name: CI / Automated Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify

      - name: Run Go Vet (Static Analysis)
        run: |
          go vet ./...

      - name: Run Unit & In-Memory Contract Tests with Coverage
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: "dummy"
          AWS_SECRET_ACCESS_KEY: "dummy"
        run: |
          go test -v -race -coverprofile=coverage.out ./...

      - name: Display Coverage Summary
        run: |
          go tool cover -func=coverage.out | tail -n 1

  # 2. Docker Compose を用いた実コンテナ結合・E2E 契約テスト (要件 C-5)
  e2e-compose-contract:
    name: Docker Compose E2E Contract Tests (C-5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Start Docker Compose Environment
        run: |
          # .env を初期化
          cp .env.example .env 2>/dev/null || true
          docker compose --profile dynamodb up -d --build tollgate mock-server dynamodb dynamodb-init

      - name: Wait for Tollgate /readyz
        run: |
          echo "Waiting for Tollgate proxy to become healthy..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/readyz; then
              echo "Tollgate is ready!"
              exit 0
            fi
            echo "Attempt $i: waiting 2s..."
            sleep 2
          done
          docker compose logs tollgate
          exit 1

      - name: Run E2E Contract Tests against Real Containers
        env:
          E2E_BASE_URL: "http://localhost:8080"
          E2E_ADMIN_KEY: "admin-secret-key-for-local-dev"
        run: |
          go test -v -run TestE2E_ContractVerification ./tests

      - name: Teardown Docker Compose
        if: always()
        run: |
          docker compose --profile dynamodb down -v

  # 3. マルチアーキテクチャ Docker ビルド検証 (AMD64 / ARM64 - 要件 C-1)
  docker-build-check:
    name: Multi-Arch Docker Build Check (ARM64/AMD64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (Dry-run without push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
